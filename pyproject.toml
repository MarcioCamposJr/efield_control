[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efield-control"
version = "0.1.0"
description = "Sensor centering and field mapping control with Red Pitaya"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyserial>=3.5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
efield-control = "efield_control.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "plotly>=5.0",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
include = ["efield_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
